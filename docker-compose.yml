services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_PORT: ${APP_PORT:-7000}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/gym_social}
      DATABASE_USER: ${POSTGRES_USER:-gym_social}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-gym_social}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me-123456789}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-7000}:7000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - gym-social-network

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - gym-social-network

volumes:
  postgres-data:

networks:
  gym-social-network:
